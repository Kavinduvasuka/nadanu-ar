<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120b10" />
  <title>Nadanu 3.0 | Grand Finale AR</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {"imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }}
  </script>
</head>
<body>
  <main id="landing">
    <div class="frame">
      <div class="eyebrow">COMPUTING SOCIETY OF ICBT PRESENTS</div>
      <h1>NADANU <span>3.0</span></h1>
      <div class="line"></div>
      <h2>GRAND FINALE</h2>
      <p>Bring your invitation to life. Tap Start AR and point your camera at the printed B5 invitation.</p>
      <button id="startButton" type="button">START AR EXPERIENCE</button>
      <p class="hint">Camera permission is required · Best on Chrome or Safari</p>
      <p id="message" role="status" aria-live="polite"></p>
    </div>
  </main>
  <div id="arContainer"></div>
  <div id="arUI" hidden>
    <div class="topbar"><strong>NADANU 3.0</strong><button id="stopButton" type="button">EXIT AR</button></div>
    <div id="trackingStatus" class="tracking">Point camera at the Grand Finale invitation</div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
