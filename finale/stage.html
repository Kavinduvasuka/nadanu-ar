<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nadanu 3.0 | Free Moving 3D Stage</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07040f;color:#f6efff;font-family:Unbounded,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
header{position:fixed;left:15px;right:15px;top:calc(12px + env(safe-area-inset-top));pointer-events:none;text-shadow:0 0 16px #ff3d9a}
h1{font-size:clamp(18px,3.2vw,29px);margin:0 0 8px}header p{font-size:11px;color:#d6c6e5;margin:0;line-height:1.7}
nav{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:8px;right:8px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
button,a.action{font:600 11px Unbounded,system-ui,sans-serif;cursor:pointer;background:#21152cbb;color:#f6efff;border:1px solid #ffffff55;border-radius:99px;padding:12px 15px;text-decoration:none;backdrop-filter:blur(9px)}
button.active{background:#ff3d9a;color:#24001b;border-color:#ff3d9a}
#status{position:fixed;top:calc(95px + env(safe-area-inset-top));left:15px;right:15px;color:#ffc857;font-size:11px;pointer-events:none}
</style>
</head><body>
<header><h1>Nadanu 3.0 · Stage Lights</h1><p>Drag to rotate · Scroll or pinch to zoom · Free-moving 3D concert view</p></header>
<div id="status">Loading your 3D performers…</div>
<nav><button data-act="0" class="active">Solo dancer</button><button data-act="1">Solo singer</button><button data-act="2">Group dance</button><button id="sound">Sound off</button><a class="action" href="./">Back to AR</a></nav>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.147.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.147.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07040f);scene.fog=new THREE.FogExp2(0x07040f,.035);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
scene.add(new THREE.HemisphereLight(0x8b6aff,0x180c25,1.1));
const cols=[0xff3d9a,0x33e1ff,0xffc857];
const lights=cols.map((col,i)=>{const light=new THREE.SpotLight(col,2.7,40,.55,.65,1);
light.position.set(Math.cos(i*2.1)*6,9,Math.sin(i*2.1)*6);light.target.position.set(0,1,0);
scene.add(light,light.target);return light;});
const cones=lights.map(l=>{const m=new THREE.Mesh(new THREE.ConeGeometry(2.1,10,32,1,true),
 new THREE.MeshBasicMaterial({color:l.color,transparent:true,opacity:.055,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
scene.add(m);return m;});
const floor=new THREE.Mesh(new THREE.CircleGeometry(10,96),new THREE.MeshStandardMaterial({color:0x140a28,metalness:.75,roughness:.22,side:THREE.DoubleSide}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const rings=[0xff3d9a,0x33e1ff,0xffc857,0xff3d9a].map((col,i)=>{
const r=new THREE.Mesh(new THREE.RingGeometry(1.8+i*1.6,1.9+i*1.6,96),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.48,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false}));
r.rotation.x=-Math.PI/2;r.position.y=.016;scene.add(r);return r;});
const bars=[];for(let i=0;i<40;i++){const a=i/40*Math.PI*2;const m=new THREE.Mesh(new THREE.BoxGeometry(.16,1,.16),new THREE.MeshBasicMaterial({color:0xffffff}));m.position.set(Math.sin(a)*9,0,Math.cos(a)*9);scene.add(m);bars.push(m);}
const halo=new THREE.Mesh(new THREE.TorusGeometry(2.4,.04,12,96),new THREE.MeshBasicMaterial({color:0xff3d9a}));halo.position.set(0,2.2,-2.6);scene.add(halo);
const particleCount=500,pts=new Float32Array(particleCount*3);
for(let i=0;i<particleCount;i++){let a=Math.random()*Math.PI*2,r=Math.random()*9;pts[i*3]=Math.cos(a)*r;pts[i*3+1]=Math.random()*8;pts[i*3+2]=Math.sin(a)*r;}
const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.BufferAttribute(pts,3));
scene.add(new THREE.Points(geom,new THREE.PointsMaterial({size:.07,color:0xffd9f5,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false})));
const acts=[new THREE.Group(),new THREE.Group(),new THREE.Group()];acts.forEach(a=>scene.add(a));
const mixers=[];const loader=new GLTFLoader();let loaded=0;
const source=[{url:'./assets/solo-dancer.glb',height:2.5,width:3},{url:'./assets/singer.glb',height:2.5,width:3},{url:'./assets/group_dancers.glb',height:3,width:7}];
source.forEach((cfg,i)=>loader.load(cfg.url,gltf=>{
const model=gltf.scene;model.updateMatrixWorld(true);
const bb=new THREE.Box3().setFromObject(model),size=bb.getSize(new THREE.Vector3()),center=bb.getCenter(new THREE.Vector3());
if(size.y<=0)throw Error('Model has no usable height');
const scale=Math.min(cfg.height/size.y,cfg.width/Math.max(size.x,.0001));
model.scale.multiplyScalar(scale);model.position.set(-center.x*scale,-bb.min.y*scale,-center.z*scale);
model.traverse(o=>{if(o.isMesh||o.isSkinnedMesh){o.castShadow=true;o.frustumCulled=false}});
acts[i].add(model);
if(gltf.animations.length){const mixer=new THREE.AnimationMixer(model);mixer.clipAction(gltf.animations[0]).play();mixers.push(mixer);}
loaded++;document.getElementById('status').textContent=loaded===3?'Drag to rotate · pinch to zoom':loaded+' of 3 performers loaded';
},undefined,e=>{console.error(cfg.url,e);document.getElementById('status').textContent='Could not load '+cfg.url+' — check files';}));
let mode=0,t=0,angle=0,radius=6,height=2.3,look=1.1,drag=false,px=0,pinch=0;
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{mode=+b.dataset.act;document.querySelectorAll('[data-act]').forEach(x=>x.classList.toggle('active',b===x));});
const canvas=renderer.domElement;
canvas.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(drag){angle-=(e.clientX-px)*.008;px=e.clientX}});
canvas.addEventListener('pointerup',()=>drag=false);
canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();radius=THREE.MathUtils.clamp(radius+e.deltaY*.009,2.8,18)},{passive:false});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];const dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)radius=THREE.MathUtils.clamp(radius+(pinch-dist)*.02,2.8,18);pinch=dist}},{passive:false});
canvas.addEventListener('touchend',()=>pinch=0);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setSize(innerWidth,innerHeight);
let ctx=null,oscTimer=null;
document.getElementById('sound').onclick=async e=>{
if(oscTimer){clearInterval(oscTimer);oscTimer=null;e.target.textContent='Sound off';return;}
ctx??=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();e.target.textContent='Sound on';
const notes=[220,261.6,329.6,392,440,329.6,261.6,196];let k=0;
oscTimer=setInterval(()=>{const o=ctx.createOscillator(),g=ctx.createGain(),now=ctx.currentTime;o.type='triangle';o.frequency.value=notes[k++%notes.length];g.gain.setValueAtTime(.018,now);g.gain.exponentialRampToValueAtTime(.001,now+.18);o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+.18)},240);
};
const vector=new THREE.Vector3(),quat=new THREE.Quaternion(),up=new THREE.Vector3(0,1,0),clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);t+=dt;
acts.forEach((g,i)=>g.visible=i===mode);mixers.forEach(m=>m.update(dt));
lights.forEach((l,i)=>{const a=t*.4+i*2.1;l.position.set(Math.cos(a)*6,9,Math.sin(a)*6);
l.target.position.set(Math.sin(t*.7+i)*1.5,1,Math.cos(t*.6+i)*1.5);
const beam=cones[i],v=vector.copy(l.position).sub(l.target.position),len=v.length();
beam.position.copy(l.position).add(l.target.position).multiplyScalar(.5);quat.setFromUnitVectors(up,v.normalize());beam.quaternion.copy(quat);beam.scale.y=len/10;beam.material.opacity=.05+.02*Math.sin(t*3+i);});
const pulse=Math.pow(1-((t*2)%1),3);
rings.forEach((r,i)=>{r.scale.setScalar(1+pulse*.04*(i+1));r.material.opacity=.3+pulse*.35;});
bars.forEach((b,i)=>{const h=1.2+(Math.sin(t*3+i*.7)*.5+.5)*4+pulse*2.5;b.scale.y=h;b.position.y=h/2;b.material.color.setHSL((i/40+t*.05)%1,.9,.55)});
halo.material.color.setHSL((t*.08)%1,.9,.6);halo.scale.setScalar(1+pulse*.05);
const p=geom.attributes.position;for(let i=0;i<particleCount;i++){let y=p.array[i*3+1]+dt*(.2+(i%5)*.06);if(y>8)y=0;p.array[i*3+1]=y;}p.needsUpdate=true;
const targetR=[6,5.2,11.5][mode],targetH=[2.2,1.9,5.5][mode],targetLook=[1.1,1.35,.9][mode];
// Automatically frame different acts on the first selection, then allow free orbit and zoom.
if(!drag&&!pinch){radius+=(targetR-radius)*.002;height+=(targetH-height)*.013;look+=(targetLook-look)*.013;}
camera.position.set(Math.sin(angle)*radius,height,Math.cos(angle)*radius);camera.lookAt(0,look,0);renderer.render(scene,camera)}
frame();
</script></body></html>
