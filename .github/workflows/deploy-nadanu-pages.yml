name: Deploy Nadanu Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nadanu-pages-publish
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build lean static site without unused original source PNGs
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='_site/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='auditions/assets/post 10.png' \
            --exclude='invitation/assets/post 10.png' \
            --exclude='finale/assets/finale-invitation.png'
          du -sh _site
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
